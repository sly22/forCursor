<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>forCursor Test</title>
  <style>
    :root {
      --bg: #0f1419;
      --fg: #e7ecf3;
      --accent: #3d9cf0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(ellipse at 20% 10%, #1a2a3a 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, #1a2430 0%, transparent 45%),
        var(--bg);
      color: var(--fg);
    }
    main {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
    }
    p {
      color: #9aa8b8;
      font-size: 1.05rem;
      margin-bottom: 1.5rem;
    }
    .badge {
      display: inline-block;
      padding: 0.4rem 0.9rem;
      border: 1px solid rgba(61, 156, 240, 0.45);
      color: var(--accent);
      font-size: 0.85rem;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <main>
    <h1>forCursor</h1>
    <p>GitHub 연동 테스트 페이지입니다.</p>
    <span class="badge">src/index.html</span>
  </main>
</body>
</html>
